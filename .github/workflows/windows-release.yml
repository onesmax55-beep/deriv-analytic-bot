name: Windows Release Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read
  actions: write

jobs:
  windows-release:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python 3.11 for native modules
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify build toolchain
        shell: pwsh
        run: |
          python --version
          npm --version

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci --no-audit --no-fund
          } else {
            npm install --no-audit --no-fund
          }

      - name: Run core integration tests
        shell: pwsh
        run: npm test -- --runInBand

      - name: Verify package metadata
        shell: pwsh
        run: |
          node -e "const p=require('./package.json'); if(p.main !== 'app/main.js') process.exit(1); console.log('entry:', p.main)"
          if (!(Test-Path app/main.js)) { throw 'Missing app/main.js' }
          if (!(Test-Path app/preload.js)) { throw 'Missing app/preload.js' }
          if (!(Test-Path app/index.html)) { throw 'Missing app/index.html' }

      - name: Build Windows x64 installer
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Runtime smoke test - portable executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/Deriv Analytics Pro 1.0.0.exe'
          if (!(Test-Path $exe)) { throw "Portable executable not found: $exe" }
          $proc = Start-Process -FilePath $exe -ArgumentList '--disable-gpu','--no-sandbox' -PassThru
          try {
            Start-Sleep -Seconds 15
            if ($proc.HasExited) { throw "Application exited during smoke test with code $($proc.ExitCode)" }
            Write-Host "Runtime smoke test passed. PID=$($proc.Id)"
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: List and verify release artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path dist)) { throw 'dist directory was not created' }
          Get-ChildItem dist -File | Format-Table Name,Length
          $exes = Get-ChildItem dist -Filter *.exe -File
          if ($exes.Count -eq 0) { throw 'No Windows installer artifact was produced' }
          foreach ($exe in $exes) {
            if ($exe.Length -lt 1KB) { throw "Suspiciously small installer: $($exe.Name)" }
            $hash = Get-FileHash $exe.FullName -Algorithm SHA256
            "$($exe.Name) SHA256=$($hash.Hash)"
          }

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deriv-analytics-pro-windows-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
